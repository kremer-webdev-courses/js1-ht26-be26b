<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/style.css">
    <title>JS1 - En todo i taget</title>
</head>

<body>
    <header>
        <h1>JS1 - En todo i taget</h1>

        <nav>
            <a href="index.html">Home</a>
        </nav>
    </header>

    <main>
        <form id="todo-form">
            <label for="todo-id">Todo-id (1–200):</label>
            <input type="number" id="todo-id" min="1" max="200" value="1" required>
            <button type="submit">Hämta todo</button>
        </form>

        <button id="next-button">Nästa todo</button>

        <p id="status"></p>

        <ol id="todo-list"></ol>
    </main>

    <script src="scripts/03-single-todo.js"></script>
</body>

</html>
