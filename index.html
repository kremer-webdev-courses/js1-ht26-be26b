<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <link rel="stylesheet" href="styles/styles.css" />
    <title>JS1 - TODO</title>
</head>

<body class="container">
    <header>
        <h1>JS1 - TODO</h1>
    </header>

    <main>
        <form id="todo-form">
            <div class="mb-3">
                <label for="todo-input" class="form-label">Skriv en todo</label>
                <input type="text" class="form-control" id="todo-input" aria-describedby="todoHelp">
                <div id="todoHelp" class="form-text">Skriv en todo</div>
                <button type="submit" class="btn-solid theme-primary">Lägg till</button>
            </div>
        </form>

        <ul class="list-group" id="todo-list"></ul>
    </main>

    <footer></footer>

    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
        crossorigin="anonymous"></script>
    <script src="scripts/script.js"></script>
</body>

</html>
